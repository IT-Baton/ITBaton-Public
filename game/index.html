<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Play Word Atlas Online — Free Word Puzzle</title>
    <meta name="description" content="Play Word Atlas in your browser. Form words from letters, reveal the crossword, and take your time — there is no timer. Free word puzzle from Spicy Baton.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0d1430">
    <link rel="canonical" href="https://spicybaton.com/game/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Play Word Atlas Online">
    <meta property="og:description" content="Play Word Atlas in your browser. A relaxing crossword-style word puzzle with no timer.">
    <meta property="og:url" content="https://spicybaton.com/game/">
    <meta property="og:image" content="https://spicybaton.com/static/play/icon.webp">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/game.css">
    <script src="../scripts/analytics.js" defer></script>
  </head>
  <body>
    <noscript><div><img src="https://mc.yandex.ru/watch/111470998" style="position:absolute; left:-9999px;" alt=""></div></noscript>
    <header class="game-bar">
      <a class="game-btn" href="../index.html">Back</a>
      <h1 class="game-bar-title">Word Atlas</h1>
      <a class="game-btn game-btn-store" href="https://play.google.com/store/apps/details?id=com.SpicyBaton.WordAtlas" target="_blank" rel="noopener noreferrer">Google Play</a>
    </header>
    <div class="game-stage">
      <canvas id="unity-canvas" width="540" height="960" tabindex="-1"></canvas>
    </div>
    <script src="Build/web.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var bar = document.querySelector(".game-bar");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      function fitMobileCanvas() {
        var barHeight = bar ? bar.offsetHeight : 0;
        canvas.style.position = "fixed";
        canvas.style.left = "0";
        canvas.style.right = "0";
        canvas.style.top = barHeight + "px";
        canvas.style.width = "100%";
        canvas.style.height = "calc(100% - " + barHeight + "px)";
        canvas.style.maxWidth = "none";
        canvas.style.aspectRatio = "auto";
      }

      if (isMobile) {
        fitMobileCanvas();
        window.addEventListener("resize", fitMobileCanvas);
      }

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/web.data.unityweb",
        frameworkUrl: "Build/web.framework.js.unityweb",
        codeUrl: "Build/web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "SpicyBaton",
        productName: "Word Atlas",
        productVersion: "1.25",
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
